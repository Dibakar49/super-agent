name: Agent Studio single file
on:
  push:
    paths: ["android-singlefile/**", ".github/workflows/agentstudio.yml"]
  pull_request:
    branches: [main]
    paths: ["android-singlefile/**", ".github/workflows/agentstudio.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agentstudio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
      - name: Prepare an existing-app host with one feature source and no feature resources
        run: python3 android-singlefile/verify.py "$RUNNER_TEMP/agentstudio-validation"
      - name: Build and test embedded feature
        working-directory: ${{ runner.temp }}/agentstudio-validation
        env:
          JAVA_TOOL_OPTIONS: -Didea.max.intellisense.filesize=8192
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug assembleDebug 2>&1 | tee agentstudio-build.log
      - name: Summarize regression results
        if: always()
        env:
          REPORT_ROOT: ${{ runner.temp }}/agentstudio-validation/app/build/test-results/testDebugUnitTest
          BUILD_LOG: ${{ runner.temp }}/agentstudio-validation/agentstudio-build.log
        run: |
          python3 - <<'PYREPORT'
          import os, pathlib, xml.etree.ElementTree as ET
          roots=[ET.parse(p).getroot() for p in pathlib.Path(os.environ['REPORT_ROOT']).glob('TEST-*.xml')]
          def annotation(level,title,body):
              escaped=body.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::'+level+' title='+title+'::'+escaped)
          annotation('notice','Test totals',str(sum(int(r.get('tests','0')) for r in roots))+' tests, '+str(sum(int(r.get('failures','0'))+int(r.get('errors','0')) for r in roots))+' failures/errors')
          if not roots and pathlib.Path(os.environ['BUILD_LOG']).exists():
              annotation('error','Build diagnostics','\n'.join(pathlib.Path(os.environ['BUILD_LOG']).read_text().splitlines()[-100:]))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as report:
              report.write('Agent Studio regression tests: '+str(sum(int(r.get('tests','0')) for r in roots))+' tests, '+str(sum(int(r.get('failures','0'))+int(r.get('errors','0')) for r in roots))+' failures/errors.\n\n')
              for root in roots:
                  for case in root.findall('testcase'):
                      for failure in list(case.findall('failure'))+list(case.findall('error')):
                          annotation('error',root.get('name','')+' '+case.get('name',''),(failure.text or '')[:8000])
                          report.write('### '+root.get('name','')+' — '+case.get('name','')+'\n\n```text\n'+(failure.text or '')[:6000]+'\n```\n\n')
          PYREPORT
      - name: Upload test reports and actual native renders
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: agentstudio-verification
          path: |
            ${{ runner.temp }}/agentstudio-validation/app/build/reports/tests/
            ${{ runner.temp }}/agentstudio-validation/app/build/test-home/screenshots/
            ${{ runner.temp }}/agentstudio-validation/app/build/reports/lint-results-debug.*
          retention-days: 14
      - name: Upload the single Kotlin file
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: agentstudio-single-kotlin-file
          path: android-singlefile/agentstudio.kt
